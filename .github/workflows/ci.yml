name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - run: uv venv

      - name: Install CPU-only torch (runner has no GPU)
        run: uv pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install package (dev)
        run: uv pip install -e ".[dev]"

      - name: Lint (ruff)
        run: uv run ruff check code/src/models tests/

      - name: Test (pytest)
        run: uv run pytest tests/
